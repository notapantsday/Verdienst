<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verdienst heute</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Verdienst">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
  }
  .card {
    background: #1e293b;
    border-radius: 20px;
    padding: 28px 24px;
    width: 100%;
    max-width: 440px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  h1 {
    font-size: 1.1rem;
    font-weight: 600;
    margin: 0 0 20px;
    color: #94a3b8;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  h2 {
    font-size: 0.75rem;
    font-weight: 700;
    margin: 0 0 12px;
    color: #64748b;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .earned {
    font-size: 3.2rem;
    font-weight: 700;
    color: #4ade80;
    font-variant-numeric: tabular-nums;
    margin: 8px 0 4px;
    line-height: 1;
  }
  .earned small { font-size: 1.6rem; color: #86efac; }
  .sub {
    font-size: 0.9rem;
    color: #94a3b8;
    margin-bottom: 24px;
  }
  .row {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid #334155;
    font-size: 0.95rem;
  }
  .row:last-of-type { border-bottom: none; }
  .row span:last-child {
    color: #e2e8f0;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }
  .row span:first-child { color: #94a3b8; }
  label.option {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    cursor: pointer;
    font-size: 0.9rem;
    user-select: none;
  }
  label.option input[type="checkbox"] {
    width: 20px;
    height: 20px;
    accent-color: #4ade80;
    cursor: pointer;
    flex-shrink: 0;
  }
  .divider {
    height: 1px;
    background: #334155;
    margin: 20px 0;
  }
  .deduction {
    color: #f87171 !important;
  }
  .bonus {
    color: #4ade80 !important;
  }
  .money {
    margin: 8px 0 6px;
  }
  .pile {
    position: relative;
    width: 100%;
    border-radius: 14px;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 60%, #26384f 0%, #16202f 100%);
    box-shadow: inset 0 2px 10px rgba(0,0,0,0.45);
  }
  .piece {
    position: absolute;
    transform: rotate(var(--rot, 0deg));
    filter: drop-shadow(0 2px 2px rgba(0,0,0,0.55));
    animation: dropIn 0.45s ease-out;
  }
  .piece svg { display: block; }
  @keyframes dropIn {
    from { opacity: 0; transform: translateY(-34px) rotate(var(--rot, 0deg)) scale(1.15); }
    to   { opacity: 1; transform: translateY(0) rotate(var(--rot, 0deg)) scale(1); }
  }
  .pile-total {
    position: absolute;
    top: 10px;
    right: 14px;
    z-index: 1000;
    font-size: 0.95rem;
    font-weight: 700;
    color: #4ade80;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 1px 3px rgba(0,0,0,0.7);
  }
  .status {
    font-size: 0.8rem;
    color: #64748b;
    text-align: center;
    margin-top: 16px;
  }

  .field {
    margin-bottom: 14px;
  }
  .field label {
    display: block;
    font-size: 0.85rem;
    color: #94a3b8;
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    background: #0f172a;
    border: 1px solid #334155;
    color: #e2e8f0;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 0.95rem;
    font-family: inherit;
  }
  .field input:focus {
    outline: none;
    border-color: #4ade80;
  }
  .field select {
    background: #0f172a;
    border: 1px solid #334155;
    color: #e2e8f0;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 0.95rem;
    font-family: inherit;
  }
  .field select:focus {
    outline: none;
    border-color: #4ade80;
  }
  .time-row {
    display: flex;
    gap: 10px;
  }
  .time-row select {
    flex: 1;
  }
  .time-row input[type="text"] {
    flex: 1.6;
    min-width: 0;
  }
  .field input.invalid {
    border-color: #f87171;
  }
  .rate-preview {
    font-size: 0.8rem;
    color: #64748b;
    margin: -6px 0 14px;
  }

  button.btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }
  .btn-start {
    background: #4ade80;
    color: #0f172a;
  }
  .btn-start:hover { background: #86efac; }
  .btn-stop {
    background: #f87171;
    color: #0f172a;
  }
  .btn-stop:hover { background: #fca5a5; }

  .saved-hint {
    font-size: 0.75rem;
    color: #4ade80;
    text-align: center;
    height: 16px;
    margin-top: 8px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .saved-hint.show { opacity: 1; }
</style>
</head>
<body>
<div class="card">

  <h1>Verdienst heute</h1>
  <div class="earned" id="earned">0,00 <small>€</small></div>
  <div class="money" id="money" style="display:none;">
    <div class="pile" id="pile"><div class="pile-total" id="pileTotal">0,00 €</div></div>
  </div>
  <div class="sub" id="rate">– €/Std.</div>

  <div class="row"><span>Start</span><span id="startDisplay">–</span></div>
  <div class="row"><span>Arbeitszeit</span><span id="worked">0:00:00</span></div>
  <div class="row" id="deductionRow" style="display:none;">
    <span>Pausenabzug</span>
    <span class="deduction" id="deduction">– 0,00 €</span>
  </div>
  <div class="row" id="surchargeNowRow" style="display:none;">
    <span>Aktueller Zuschlag</span>
    <span id="surchargeNow">–</span>
  </div>
  <div class="row" id="surchargeSumRow" style="display:none;">
    <span>Zuschläge gesamt</span>
    <span class="bonus" id="surchargeSum">+ 0,00 €</span>
  </div>

  <div class="divider"></div>

  <h2>Einstellungen</h2>

  <div class="field">
    <label for="salaryInput">Monatsgehalt (Euro)</label>
    <input type="number" id="salaryInput" placeholder="z. B. 3200" step="0.01" min="0">
  </div>

  <div class="field">
    <label for="hoursInput">Wöchentliche Arbeitszeit (Std.)</label>
    <input type="number" id="hoursInput" placeholder="z. B. 40" step="0.5" min="0">
  </div>

  <div class="rate-preview" id="ratePreview">– €/Std. · – €/Sek.</div>

  <div class="field">
    <label for="startTimeInput">Start-Zeit</label>
    <div class="time-row">
      <input type="text" id="startTimeInput" inputmode="numeric" pattern="[0-9]*" maxlength="5" placeholder="HH:MM (z. B. 1907)" autocomplete="off" enterkeyhint="done">
      <select id="startDaySelect">
        <option value="0">Heute</option>
        <option value="-1">Gestern</option>
      </select>
    </div>
  </div>

  <label class="option">
    <input type="checkbox" id="breakOption">
    Pausen berücksichtigen (0,5 h ab 6 Std., +0,25 h ab 9 Std.)
  </label>

  <label class="option">
    <input type="checkbox" id="surchargeOption" checked>
    Zuschläge berücksichtigen (Nacht 15 %, Sa 10 %, So 25 %)
  </label>

  <label class="option">
    <input type="checkbox" id="moneyOption">
    Verdienst als Scheine &amp; Münzen darstellen
  </label>

  <label class="option">
    <input type="checkbox" id="demoMode">
    Demo-Modus (Zeitraffer, 60×)
  </label>

  <div class="saved-hint" id="savedHint">Einstellungen gespeichert</div>

  <div class="divider"></div>

  <button class="btn btn-start" id="startBtn">Start</button>

  <div class="status" id="status">Nicht gestartet.</div>
</div>

<script>
(function() {
  // ==== KONSTANTEN ====
  const WOCHEN_PRO_JAHR = 52.1429; // 365 Tage / 7
  const MONATE_PRO_JAHR = 12;

  const PAUSE_1_AB_STUNDEN = 6;
  const PAUSE_1_STUNDEN = 0.5;
  const PAUSE_2_AB_STUNDEN = 9;
  const PAUSE_2_STUNDEN = 0.25;

  // Zuschläge (es gilt immer nur der jeweils höchste, keine Addition)
  const ZUSCHLAG_NACHT = 15;    // % zwischen NACHT_AB und NACHT_BIS Uhr
  const ZUSCHLAG_SAMSTAG = 10;  // %
  const ZUSCHLAG_SONNTAG = 25;  // %
  const NACHT_AB = 20;          // Uhr
  const NACHT_BIS = 6;          // Uhr

  const STORAGE_KEY = 'verdienstTracker';

  // ==== DOM ====
  const salaryInput = document.getElementById('salaryInput');
  const hoursInput = document.getElementById('hoursInput');
  const ratePreview = document.getElementById('ratePreview');
  const startTimeEl = document.getElementById('startTimeInput');

  // Nur Ziffern zulassen, max. 4, Doppelpunkt automatisch einfügen: 1907 -> 19:07
  function formatDigits(raw) {
    const d = raw.replace(/\D/g, '').slice(0, 4);
    return d.length > 2 ? d.slice(0, 2) + ':' + d.slice(2) : d;
  }

  // Text -> "HH:MM" oder null, wenn ungültig. Erlaubt auch 907 -> 09:07 und 19 -> 19:00
  function parseTime(text) {
    const d = text.replace(/\D/g, '');
    let hh, mm;
    if (d.length === 4) { hh = d.slice(0, 2); mm = d.slice(2); }
    else if (d.length === 3) { hh = '0' + d[0]; mm = d.slice(1); }
    else if (d.length === 1 || d.length === 2) { hh = d.padStart(2, '0'); mm = '00'; }
    else return null;
    if (Number(hh) > 23 || Number(mm) > 59) return null;
    return hh + ':' + mm;
  }

  startTimeEl.addEventListener('input', () => {
    startTimeEl.value = formatDigits(startTimeEl.value);
    const digits = startTimeEl.value.replace(/\D/g, '');
    if (digits.length === 4) {
      const ok = parseTime(startTimeEl.value) !== null;
      startTimeEl.classList.toggle('invalid', !ok);
      // Bei vollständiger, gültiger Eingabe sofort übernehmen
      if (ok) startTimeEl.dispatchEvent(new Event('change'));
    } else {
      startTimeEl.classList.remove('invalid');
    }
  });

  startTimeEl.addEventListener('blur', () => {
    if (startTimeEl.value === '') { startTimeEl.classList.remove('invalid'); return; }
    const p = parseTime(startTimeEl.value);
    if (p) { startTimeEl.value = p; startTimeEl.classList.remove('invalid'); }
    else startTimeEl.classList.add('invalid');
  });

  // Verhält sich nach außen wie ein Feld mit Wert "HH:MM" (oder '' bei ungültig/leer)
  const startTimeInput = {
    get value() { return parseTime(startTimeEl.value) || ''; },
    set value(v) { startTimeEl.value = v || ''; startTimeEl.classList.remove('invalid'); },
    addEventListener(ev, fn) { startTimeEl.addEventListener(ev, fn); }
  };
  const startDaySelect = document.getElementById('startDaySelect');
  const breakOption = document.getElementById('breakOption');
  const demoMode = document.getElementById('demoMode');
  const surchargeOption = document.getElementById('surchargeOption');
  const elSurchargeNowRow = document.getElementById('surchargeNowRow');
  const elSurchargeNow = document.getElementById('surchargeNow');
  const elSurchargeSumRow = document.getElementById('surchargeSumRow');
  const elSurchargeSum = document.getElementById('surchargeSum');
  const moneyOption = document.getElementById('moneyOption');
  const elMoney = document.getElementById('money');
  const startBtn = document.getElementById('startBtn');
  const savedHint = document.getElementById('savedHint');

  const elEarned = document.getElementById('earned');
  const elRate = document.getElementById('rate');
  const elWorked = document.getElementById('worked');
  const elDeduction = document.getElementById('deduction');
  const elDeductionRow = document.getElementById('deductionRow');
  const elStatus = document.getElementById('status');
  const startDisplay = document.getElementById('startDisplay');

  let state = {
    salary: null,
    weeklyHours: null,
    startTimestamp: null, // ms epoch
    startIsPreviousDay: false, // true = Start war gestern (Nachtdienst)
    breakOption: false,
    surchargeOption: true,
    moneyVisual: false,
    demoMode: false
  };

  let demoOffset = 0;
  let lastRealTime = Date.now();
  let savedHintTimeout = null;

  // ==== PERSISTENZ ====
  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      savedHint.classList.add('show');
      clearTimeout(savedHintTimeout);
      savedHintTimeout = setTimeout(() => savedHint.classList.remove('show'), 1200);
    } catch(e) {}
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        // Startzeit nur übernehmen, wenn sie plausibel aktuell ist
        // (max. 30 Std. in der Vergangenheit, max. 12 Std. in der Zukunft) –
        // so bleiben Nachtdienste über Mitternacht erhalten, alte Reste werden verworfen.
        if (parsed.startTimestamp) {
          const now = Date.now();
          const diff = now - parsed.startTimestamp;
          if (diff > 30 * 3600 * 1000 || diff < -12 * 3600 * 1000) {
            parsed.startTimestamp = null;
            parsed.startIsPreviousDay = false;
          }
        }
        state = Object.assign(state, parsed);
      }
    } catch(e) {}
  }

  // ==== HILFSFUNKTIONEN ====
  function berechneSekundenlohn(monatsgehalt, wochenstunden) {
    if (!monatsgehalt || !wochenstunden) return 0;
    const jahresgehalt = monatsgehalt * MONATE_PRO_JAHR;
    const jahresstunden = wochenstunden * WOCHEN_PRO_JAHR;
    const stundenlohn = jahresgehalt / jahresstunden;
    return stundenlohn / 3600;
  }

  function formatMoney(v) {
    return v.toFixed(2).replace('.', ',');
  }

  function formatDuration(totalSeconds) {
    if (totalSeconds < 0) totalSeconds = 0;
    const h = Math.floor(totalSeconds / 3600);
    const m = Math.floor((totalSeconds % 3600) / 60);
    const s = Math.floor(totalSeconds % 60);
    return h + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }

  function berechnePausenAbzug(gearbeiteteStunden) {
    let abzug = 0;
    if (gearbeiteteStunden >= PAUSE_1_AB_STUNDEN) abzug += PAUSE_1_STUNDEN;
    if (gearbeiteteStunden >= PAUSE_2_AB_STUNDEN) abzug += PAUSE_2_STUNDEN;
    return abzug;
  }

  function timeStringFromTimestamp(ts) {
    const d = new Date(ts);
    return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }

  function timestampFromTimeString(timeStr, isPreviousDay) {
    const [hh, mm] = timeStr.split(':').map(Number);
    const d = new Date();
    if (isPreviousDay) d.setDate(d.getDate() - 1);
    d.setHours(hh, mm, 0, 0);
    return d.getTime();
  }

  function formatStartDisplay(ts, isPreviousDay) {
    return timeStringFromTimestamp(ts) + (isPreviousDay ? ' (Vortag)' : '');
  }

  // ==== VORSCHAU DER RATE ====
  function updateRatePreview() {
    const salary = parseFloat(salaryInput.value);
    const hours = parseFloat(hoursInput.value);
    if (salary > 0 && hours > 0) {
      const jahresgehalt = salary * MONATE_PRO_JAHR;
      const jahresstunden = hours * WOCHEN_PRO_JAHR;
      const stundenlohn = jahresgehalt / jahresstunden;
      const sekundenlohn = stundenlohn / 3600;
      ratePreview.textContent = formatMoney(stundenlohn) + ' €/Std. · ' + sekundenlohn.toFixed(6).replace('.', ',') + ' €/Sek.';
      elRate.textContent = formatMoney(stundenlohn) + ' €/Std.';
    } else {
      ratePreview.textContent = '– €/Std. · – €/Sek.';
      elRate.textContent = '– €/Std.';
    }
  }

  // ==== EINSTELLUNGEN ÄNDERN (jederzeit, auch im laufenden Betrieb) ====
  function onSettingsChange() {
    state.salary = parseFloat(salaryInput.value) || null;
    state.weeklyHours = parseFloat(hoursInput.value) || null;
    state.breakOption = breakOption.checked;
    state.demoMode = demoMode.checked;
    state.surchargeOption = surchargeOption.checked;
    state.moneyVisual = moneyOption.checked;
    updateRatePreview();
    saveState();
    update();
  }

  salaryInput.addEventListener('input', onSettingsChange);
  hoursInput.addEventListener('input', onSettingsChange);
  breakOption.addEventListener('change', onSettingsChange);
  demoMode.addEventListener('change', onSettingsChange);
  surchargeOption.addEventListener('change', onSettingsChange);
  moneyOption.addEventListener('change', onSettingsChange);

  function applyManualStartTime() {
    if (!startTimeInput.value) return;
    const isPrevDay = startDaySelect.value === '-1';
    state.startTimestamp = timestampFromTimeString(startTimeInput.value, isPrevDay);
    state.startIsPreviousDay = isPrevDay;
    lastRealTime = Date.now();
    demoOffset = 0;
    startBtn.textContent = 'Zurücksetzen';
    startBtn.classList.remove('btn-start');
    startBtn.classList.add('btn-stop');
    startDisplay.textContent = formatStartDisplay(state.startTimestamp, state.startIsPreviousDay);
    saveState();
    update();
  }

  startTimeInput.addEventListener('change', applyManualStartTime);
  startDaySelect.addEventListener('change', applyManualStartTime);

  // ==== START / ZURÜCKSETZEN ====
  function isRunning() {
    return !!state.startTimestamp;
  }

  function refreshStartButton() {
    if (isRunning()) {
      startBtn.textContent = 'Zurücksetzen';
      startBtn.classList.remove('btn-start');
      startBtn.classList.add('btn-stop');
      startDisplay.textContent = formatStartDisplay(state.startTimestamp, state.startIsPreviousDay);
    } else {
      startBtn.textContent = 'Start';
      startBtn.classList.remove('btn-stop');
      startBtn.classList.add('btn-start');
      startDisplay.textContent = '–';
    }
  }

  startBtn.addEventListener('click', () => {
    if (isRunning()) {
      // Zurücksetzen
      state.startTimestamp = null;
      state.startIsPreviousDay = false;
      startTimeInput.value = '';
      startDaySelect.value = '0';
      saveState();
      refreshStartButton();
      update();
    } else {
      // Starten
      const isPrevDay = startDaySelect.value === '-1';
      const ts = startTimeInput.value
        ? timestampFromTimeString(startTimeInput.value, isPrevDay)
        : Date.now();
      state.startTimestamp = ts;
      state.startIsPreviousDay = startTimeInput.value ? isPrevDay : false;
      startTimeInput.value = timeStringFromTimestamp(ts);
      startDaySelect.value = state.startIsPreviousDay ? '-1' : '0';
      lastRealTime = Date.now();
      demoOffset = 0;
      saveState();
      refreshStartButton();
      update();
    }
  });

  // ==== ZUSCHLÄGE ====
  function zuschlagAt(ts) {
    const d = new Date(ts);
    const h = d.getHours();
    const tag = d.getDay(); // 0 = Sonntag, 6 = Samstag
    let pct = 0, grund = '';
    if (h >= NACHT_AB || h < NACHT_BIS) { pct = ZUSCHLAG_NACHT; grund = 'Nacht'; }
    if (tag === 6 && ZUSCHLAG_SAMSTAG > pct) { pct = ZUSCHLAG_SAMSTAG; grund = 'Samstag'; }
    if (tag === 0 && ZUSCHLAG_SONNTAG > pct) { pct = ZUSCHLAG_SONNTAG; grund = 'Sonntag'; }
    return { pct, grund };
  }

  // Nächster Zeitpunkt, an dem sich der Zuschlag ändern kann (0:00, 6:00, 20:00)
  function naechsteGrenze(ts) {
    const d = new Date(ts);
    const kandidaten = [];
    [NACHT_BIS, NACHT_AB].forEach(h => {
      const c = new Date(d);
      c.setHours(h, 0, 0, 0);
      if (c.getTime() > ts) kandidaten.push(c.getTime());
    });
    const morgen = new Date(d);
    morgen.setDate(morgen.getDate() + 1);
    morgen.setHours(0, 0, 0, 0);
    kandidaten.push(morgen.getTime());
    return Math.min(...kandidaten);
  }

  // Summe aller Zuschläge im Zeitraum (jede Sekunde zählt mit ihrem eigenen Zuschlag)
  function berechneZuschlag(startTs, endTs, sekundenlohn) {
    let t = startTs;
    let summe = 0;
    while (t < endTs) {
      const segEnd = Math.min(naechsteGrenze(t), endTs);
      const { pct } = zuschlagAt(t);
      summe += ((segEnd - t) / 1000) * sekundenlohn * pct / 100;
      t = segEnd;
    }
    return summe;
  }

  function hideSurcharge() {
    elSurchargeNowRow.style.display = 'none';
    elSurchargeSumRow.style.display = 'none';
  }

  // ==== SCHEINE & MÜNZEN (als unsortierter Haufen) ====
  // Scheine: w/h in px, Münzen: d = Durchmesser in px (ungefähr maßstabsgetreu)
  const DENOMS = [
    { c: 50000, note: true, name: '500 €', txt: '500', w: 99, h: 51, bg: '#8e6bb0', fg: '#ffffff' },
    { c: 20000, note: true, name: '200 €', txt: '200', w: 95, h: 51, bg: '#d7b84a', fg: '#4a3b08' },
    { c: 10000, note: true, name: '100 €', txt: '100', w: 91, h: 51, bg: '#5aa86a', fg: '#ffffff' },
    { c: 5000,  note: true, name: '50 €',  txt: '50',  w: 87, h: 48, bg: '#ee8f3a', fg: '#ffffff' },
    { c: 2000,  note: true, name: '20 €',  txt: '20',  w: 82, h: 45, bg: '#5b97d6', fg: '#ffffff' },
    { c: 1000,  note: true, name: '10 €',  txt: '10',  w: 79, h: 42, bg: '#df5f6d', fg: '#ffffff' },
    { c: 500,   note: true, name: '5 €',   txt: '5',   w: 74, h: 38, bg: '#a3adab', fg: '#2b3533' },
    { c: 200, name: '2 €',   txt: '2',  d: 39, bg: '#c9ced4', ring: '#d6a83a', fg: '#3b3f45' },
    { c: 100, name: '1 €',   txt: '1',  d: 35, bg: '#d6a83a', ring: '#c9ced4', fg: '#4a3a0c' },
    { c: 50,  name: '50 ct', txt: '50', d: 36, bg: '#d7a642', fg: '#5a410c', cent: true },
    { c: 20,  name: '20 ct', txt: '20', d: 33, bg: '#d7a642', fg: '#5a410c', cent: true },
    { c: 10,  name: '10 ct', txt: '10', d: 30, bg: '#d7a642', fg: '#5a410c', cent: true },
    { c: 5,   name: '5 ct',  txt: '5',  d: 32, bg: '#bf6b3b', fg: '#ffffff', cent: true },
    { c: 2,   name: '2 ct',  txt: '2',  d: 28, bg: '#bf6b3b', fg: '#ffffff', cent: true },
    { c: 1,   name: '1 ct',  txt: '1',  d: 24, bg: '#bf6b3b', fg: '#ffffff', cent: true }
  ];
  const MAX_PER_DENOM = 12; // so viele Stücke je Stückelung werden höchstens gezeichnet
  const PILE_HEIGHT = 220;  // px

  function zerlegeBetrag(cents) {
    const teile = [];
    let rest = cents;
    for (const d of DENOMS) {
      const n = Math.floor(rest / d.c);
      if (n > 0) { teile.push({ d, n }); rest -= n * d.c; }
    }
    return teile;
  }

  // Stabile Pseudo-Zufallszahlen aus einem Schlüssel: gleiche Stücke behalten ihren Platz im Haufen
  function hashStr(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function rand(key, salt) {
    let t = (hashStr(key + '|' + salt) + 0x6D2B79F5) >>> 0;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  // Stilisierter Euro-Schein (Farbe je Wert, Sterne, Torbogen, Brücke, Hologramm-Streifen)
  function noteSvg(d) {
    let stars = '';
    for (let k = 0; k < 12; k++) {
      const a = k * Math.PI / 6;
      stars += '<circle cx="' + (32 + 13 * Math.cos(a)).toFixed(1) + '" cy="' + (24 + 13 * Math.sin(a)).toFixed(1) + '" r="1.7" fill="#f7d54a"/>';
    }
    return '<svg viewBox="0 0 150 80" width="' + d.w + '" height="' + d.h + '">' +
      '<rect width="150" height="80" rx="4" fill="' + d.bg + '"/>' +
      '<path d="M0 44 Q37 18 75 44 T150 44" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="7"/>' +
      '<path d="M0 60 Q37 34 75 60 T150 60" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="5"/>' +
      '<rect x="3.5" y="3.5" width="143" height="73" rx="3" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="1.2"/>' +
      '<rect x="86" y="8" width="6" height="64" fill="#fff" fill-opacity=".22"/>' +
      stars +
      '<path d="M104 62 V34 a12 12 0 0 1 24 0 V62 Z" fill="#fff" fill-opacity=".3" stroke="#fff" stroke-opacity=".65" stroke-width="1.2"/>' +
      '<path d="M70 72 q8 -9 16 0 q8 -9 16 0 q8 -9 16 0 q8 -9 16 0" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="1.6"/>' +
      '<text x="11" y="68" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="36" fill="' + d.fg + '" fill-opacity=".92">' + d.txt + '</text>' +
      '<text x="141" y="18" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="10" letter-spacing="1" fill="' + d.fg + '" fill-opacity=".85">EURO</text>' +
      '<polygon points="0,0 70,0 20,80 0,80" fill="#fff" fill-opacity=".08"/>' +
      '</svg>';
  }

  // Stilisierte Euro-Münze (1 € / 2 € zweifarbig, Cent-Münzen einfarbig)
  function coinSvg(d) {
    let dots = '';
    for (let k = 0; k < 12; k++) {
      const a = k * Math.PI / 6;
      dots += '<circle cx="' + (50 + 41.5 * Math.cos(a)).toFixed(1) + '" cy="' + (50 + 41.5 * Math.sin(a)).toFixed(1) + '" r="2" fill="#000" fill-opacity=".28"/>';
    }
    const fs = d.txt.length > 1 ? 38 : 48;
    let body;
    if (d.ring) {
      body = '<circle cx="50" cy="50" r="49" fill="' + d.ring + '" stroke="#000" stroke-opacity=".35" stroke-width="1.5"/>' +
             dots +
             '<circle cx="50" cy="50" r="33" fill="' + d.bg + '" stroke="#000" stroke-opacity=".3" stroke-width="1.5"/>' +
             '<text x="50" y="50" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="' + fs + '" fill="' + d.fg + '">' + d.txt + '</text>';
    } else {
      body = '<circle cx="50" cy="50" r="49" fill="' + d.bg + '" stroke="#000" stroke-opacity=".35" stroke-width="1.5"/>' +
             '<circle cx="50" cy="50" r="43" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="2"/>' +
             '<text x="50" y="42" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="' + fs + '" fill="' + d.fg + '">' + d.txt + '</text>' +
             '<text x="50" y="74" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="12" letter-spacing="1" fill="' + d.fg + '" fill-opacity=".85">CENT</text>';
    }
    return '<svg viewBox="0 0 100 100" width="' + d.d + '" height="' + d.d + '">' + body +
           '<ellipse cx="38" cy="30" rx="27" ry="14" transform="rotate(-30 38 30)" fill="#fff" fill-opacity=".14"/></svg>';
  }

  const elPile = document.getElementById('pile');
  const elPileTotal = document.getElementById('pileTotal');
  elPile.style.height = PILE_HEIGHT + 'px';
  const pieceEls = new Map();

  function createPiece(key, d) {
    const w = d.note ? d.w : d.d;
    const h = d.note ? d.h : d.d;
    // Dreiecksverteilung: Stücke häufen sich in der Mitte
    const x = 50 + (rand(key, 1) + rand(key, 2) - 1) * 38;                      // % der Breite
    const y = PILE_HEIGHT * 0.55 + (rand(key, 3) + rand(key, 4) - 1) * PILE_HEIGHT * 0.34;
    const rot = d.note ? (rand(key, 5) - 0.5) * 70 : (rand(key, 5) - 0.5) * 120;
    const el = document.createElement('div');
    el.className = 'piece';
    el.style.cssText = 'left:calc(' + x.toFixed(2) + '% - ' + (w / 2) + 'px);top:' + (y - h / 2).toFixed(1) + 'px;' +
                       'width:' + w + 'px;height:' + h + 'px;--rot:' + rot.toFixed(1) + 'deg;';
    el.innerHTML = d.note ? noteSvg(d) : coinSvg(d);
    return el;
  }

  // Anzeige ausschalten: großer Betrag wieder sichtbar, Haufen leer
  function hideMoney() {
    elMoney.style.display = 'none';
    elEarned.style.display = '';
    pieceEls.forEach(el => el.remove());
    pieceEls.clear();
  }

  function renderMoney(cents) {
    if (!state.moneyVisual) { hideMoney(); return; }
    // Haufen ersetzt den großen Betrag, der Gesamtbetrag steht klein in der Ecke
    elEarned.style.display = 'none';
    elPileTotal.textContent = formatMoney(Math.max(0, cents) / 100) + ' €';
    const teile = cents > 0 ? zerlegeBetrag(cents) : [];
    const wanted = new Map();
    teile.forEach(({ d, n }) => {
      const idx = DENOMS.indexOf(d);
      const shown = Math.min(n, MAX_PER_DENOM);
      for (let i = 0; i < shown; i++) wanted.set(d.c + '#' + i, { d, i, idx });
    });
    elMoney.style.display = 'block';
    // Nicht mehr benötigte Stücke entfernen (z. B. wenn 5 × 1 ct zu einer 5-ct-Münze werden)
    pieceEls.forEach((el, key) => {
      if (!wanted.has(key)) { el.remove(); pieceEls.delete(key); }
    });
    // Neue Stücke fallen auf den Haufen, vorhandene bleiben liegen
    wanted.forEach((w, key) => {
      let el = pieceEls.get(key);
      if (!el) {
        el = createPiece(key, w.d);
        elPile.appendChild(el);
        pieceEls.set(key, el);
      }
      // Scheine unten, Münzen oben; kleinere Stückelungen liegen jeweils weiter oben
      el.style.zIndex = (w.d.note ? 10 : 100) + w.idx * 3 + (w.i % 3);
    });
  }

  // ==== LIVE-UPDATE ====
  function update() {
    if (!isRunning()) {
      elWorked.textContent = '0:00:00';
      elEarned.innerHTML = '0,00 <small>€</small>';
      elDeductionRow.style.display = 'none';
      elStatus.textContent = 'Nicht gestartet.';
      hideSurcharge();
      renderMoney(0);
      return;
    }

    const now = Date.now();
    const sekundenlohn = berechneSekundenlohn(state.salary, state.weeklyHours);

    if (state.demoMode) {
      const dt = (now - lastRealTime) / 1000;
      demoOffset += dt * 60;
      elStatus.textContent = 'Demo-Modus aktiv (60× Zeitraffer)';
    } else {
      elStatus.textContent = 'Live';
      demoOffset = 0;
    }
    lastRealTime = now;

    const realeSekunden = (now - state.startTimestamp) / 1000;
    const virtuelleSekunden = realeSekunden + demoOffset;

    if (virtuelleSekunden < 0) {
      elWorked.textContent = '0:00:00';
      elEarned.innerHTML = '0,00 <small>€</small>';
      elDeductionRow.style.display = 'none';
      elStatus.textContent = 'Arbeitstag hat noch nicht begonnen.';
      hideSurcharge();
      renderMoney(0);
      return;
    }

    const gearbeiteteStunden = virtuelleSekunden / 3600;
    const endTs = state.startTimestamp + virtuelleSekunden * 1000;
    let zuschlagGeld = 0;
    if (state.surchargeOption) {
      zuschlagGeld = berechneZuschlag(state.startTimestamp, endTs, sekundenlohn);
      const aktuell = zuschlagAt(endTs);
      elSurchargeNowRow.style.display = 'flex';
      elSurchargeNow.textContent = aktuell.pct > 0 ? aktuell.pct + ' % (' + aktuell.grund + ')' : 'kein Zuschlag';
      if (zuschlagGeld > 0) {
        elSurchargeSumRow.style.display = 'flex';
        elSurchargeSum.textContent = '+ ' + formatMoney(zuschlagGeld) + ' €';
      } else {
        elSurchargeSumRow.style.display = 'none';
      }
    } else {
      hideSurcharge();
    }
    const brutto = virtuelleSekunden * sekundenlohn + zuschlagGeld;

    let abzugGeld = 0;
    if (state.breakOption) {
      const abzugStunden = berechnePausenAbzug(gearbeiteteStunden);
      abzugGeld = abzugStunden * (sekundenlohn * 3600);
    }

    const netto = Math.max(0, brutto - abzugGeld);

    elWorked.textContent = formatDuration(virtuelleSekunden);
    elEarned.innerHTML = formatMoney(netto) + ' <small>€</small>';
    renderMoney(Math.round(netto * 100));

    if (state.breakOption && abzugGeld > 0) {
      elDeductionRow.style.display = 'flex';
      elDeduction.textContent = '– ' + formatMoney(abzugGeld) + ' €';
    } else {
      elDeductionRow.style.display = 'none';
    }
  }

  // ==== INITIALISIERUNG ====
  loadState();
  if (state.salary) salaryInput.value = state.salary;
  if (state.weeklyHours) hoursInput.value = state.weeklyHours;
  breakOption.checked = !!state.breakOption;
  demoMode.checked = !!state.demoMode;
  surchargeOption.checked = state.surchargeOption !== false;
  moneyOption.checked = !!state.moneyVisual;
  if (state.startTimestamp) {
    startTimeInput.value = timeStringFromTimestamp(state.startTimestamp);
    startDaySelect.value = state.startIsPreviousDay ? '-1' : '0';
  }

  updateRatePreview();
  refreshStartButton();
  update();
  setInterval(update, 1000);

  // ==== PWA: SERVICE WORKER REGISTRIEREN ====
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch((err) => {
        console.warn('Service Worker Registrierung fehlgeschlagen:', err);
      });
    });
  }
})();
</script>
